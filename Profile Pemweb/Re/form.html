<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Form Bootstrap + Tailwind | Samuel Albert Ghani</title>

  <!-- ✅ Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>

  <!-- ✅ Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<!-- Tailwind: bg-slate-100 min-h-screen py-10 -->
<body class="bg-slate-100 min-h-screen py-10">

  <!-- Bootstrap: container -->
  <div class="container">

    <!-- Bootstrap: row justify-content-center -->
    <div class="row justify-content-center">

      <!-- Bootstrap: col-md-8 -->
      <div class="col-md-8">

        <!-- Bootstrap: card shadow | Tailwind: rounded-2xl overflow-hidden -->
        <div class="card shadow rounded-2xl overflow-hidden border-0">

          <!-- Bootstrap: card-header | Tailwind: bg-blue-700 text-white flex items-center gap-2 -->
          <div class="card-header bg-blue-700 text-white flex items-center gap-2 py-3">
            <i class="bi bi-file-earmark-person-fill text-xl"></i>
            <h5 class="mb-0 font-bold tracking-wide">Form Mahasiswa</h5>
            <span class="ms-auto text-xs bg-white text-blue-700 font-semibold px-2 py-1 rounded-full">
              Bootstrap + Tailwind
            </span>
          </div>

          <!-- Bootstrap: card-body | Tailwind: p-6 -->
          <div class="card-body p-6">

            <!-- Bootstrap: alert alert-primary | Tailwind: flex items-center gap-3 rounded-xl -->
            <div class="alert alert-primary flex items-center gap-3 rounded-xl mb-6">
              <div class="w-12 h-12 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-lg flex-shrink-0">
                SA
              </div>
              <div>
                <p class="fw-bold mb-0">Samuel Albert Ghani</p>
                <small class="text-muted">NIM: 2531407071111124</small>
              </div>
            </div>

            <form>

              <!-- Bootstrap: row g-3 -->
              <div class="row g-3">

                <!-- Bootstrap: col-md-6 | Tailwind: label text-sm font-semibold -->
                <div class="col-md-6">
                  <label for="nama" class="form-label text-sm font-semibold text-slate-700">
                    <i class="bi bi-person me-1"></i> Nama Lengkap
                  </label>
                  <!-- Bootstrap: form-control | Tailwind: rounded-lg -->
                  <input type="text" id="nama" class="form-control rounded-lg"
                    value="Samuel Albert Ghani" placeholder="Nama lengkap"/>
                </div>

                <div class="col-md-6">
                  <label for="nim" class="form-label text-sm font-semibold text-slate-700">
                    <i class="bi bi-card-text me-1"></i> NIM
                  </label>
                  <input type="text" id="nim" class="form-control rounded-lg"
                    value="2531407071111124" placeholder="NIM"/>
                </div>

                <div class="col-12">
                  <label for="email" class="form-label text-sm font-semibold text-slate-700">
                    <i class="bi bi-envelope me-1"></i> Email
                  </label>
                  <!-- Bootstrap: input-group | Tailwind: rounded-lg overflow-hidden -->
                  <div class="input-group rounded-lg overflow-hidden">
                    <span class="input-group-text bg-blue-700 text-white border-0">
                      <i class="bi bi-envelope-fill"></i>
                    </span>
                    <input type="email" id="email" class="form-control border-start-0"
                      placeholder="contoh@email.com"/>
                  </div>
                </div>

                <div class="col-md-6">
                  <label for="prodi" class="form-label text-sm font-semibold text-slate-700">
                    <i class="bi bi-mortarboard me-1"></i> Program Studi
                  </label>
                  <!-- Bootstrap: form-select | Tailwind: rounded-lg -->
                  <select id="prodi" class="form-select rounded-lg">
                    <option value="">-- Pilih Prodi --</option>
                    <option selected>Teknik Informatika</option>
                    <option>Sistem Informasi</option>
                    <option>Ilmu Komputer</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label for="gender" class="form-label text-sm font-semibold text-slate-700">
                    <i class="bi bi-gender-ambiguous me-1"></i> Jenis Kelamin
                  </label>
                  <select id="gender" class="form-select rounded-lg">
                    <option selected>Laki-laki</option>
                    <option>Perempuan</option>
                  </select>
                </div>

                <!-- Semester: Bootstrap form-check | Tailwind: flex gap-4 -->
                <div class="col-12">
                  <label class="form-label text-sm font-semibold text-slate-700">
                    <i class="bi bi-calendar3 me-1"></i> Semester
                  </label>
                  <div class="flex gap-4 flex-wrap">
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="semester" id="sem1" value="1"/>
                      <label class="form-check-label text-sm" for="sem1">Semester 1</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="semester" id="sem2" value="2"/>
                      <label class="form-check-label text-sm" for="sem2">Semester 2</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="semester" id="sem3" value="3" checked/>
                      <label class="form-check-label text-sm" for="sem3">Semester 3</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="semester" id="sem4" value="4"/>
                      <label class="form-check-label text-sm" for="sem4">Semester 4</label>
                    </div>
                  </div>
                </div>

                <!-- Mata Kuliah: Bootstrap form-check | Tailwind: grid grid-cols-2 gap-1 -->
                <div class="col-12">
                  <label class="form-label text-sm font-semibold text-slate-700">
                    <i class="bi bi-journal-code me-1"></i> Mata Kuliah Favorit
                  </label>
                  <div class="grid grid-cols-2 gap-1">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="mk1" checked/>
                      <label class="form-check-label text-sm" for="mk1">Pemrograman Web</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="mk2"/>
                      <label class="form-check-label text-sm" for="mk2">Basis Data</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="mk3"/>
                      <label class="form-check-label text-sm" for="mk3">Algoritma & Pemrograman</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="mk4"/>
                      <label class="form-check-label text-sm" for="mk4">Jaringan Komputer</label>
                    </div>
                  </div>
                </div>

                <!-- Catatan: Bootstrap form-control | Tailwind: rounded-lg -->
                <div class="col-12">
                  <label for="catatan" class="form-label text-sm font-semibold text-slate-700">
                    <i class="bi bi-chat-left-text me-1"></i> Catatan
                  </label>
                  <textarea id="catatan" class="form-control rounded-lg" rows="3"
                    placeholder="Tulis catatan..."></textarea>
                  <div class="form-text text-xs text-slate-400">Maksimal 200 karakter.</div>
                </div>

                <!-- Tombol: Bootstrap btn | Tailwind: flex gap-3 -->
                <div class="col-12 flex gap-3 mt-2">
                  <button type="submit" class="btn btn-primary px-5 rounded-lg font-semibold">
                    <i class="bi bi-send me-2"></i>Kirim
                  </button>
                  <button type="reset" class="btn btn-outline-secondary px-5 rounded-lg font-semibold">
                    <i class="bi bi-arrow-counterclockwise me-1"></i>Reset
                  </button>
                </div>

              </div>
            </form>

          </div>

          <!-- Bootstrap: card-footer | Tailwind: text-center text-xs text-slate-400 -->
          <div class="card-footer text-center text-xs text-slate-400 py-3">
            <i class="bi bi-bootstrap-fill text-primary me-1"></i> Bootstrap 5
            &nbsp;+&nbsp;
            <span class="text-cyan-500 font-semibold">Tailwind CSS</span>
            &nbsp;— Samuel Albert Ghani &bull; NIM: 2531407071111124
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
