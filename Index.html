<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Kontak Modern</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <form action="#" method="POST" class="contact-form">
            <h2>Hubungi Kami</h2>
            <p>Silakan isi formulir di bawah ini untuk mengirim pesan.</p>
            
            <div class="input-group">
                <label for="name">Nama Lengkap</label>
                <input type="text" id="name" name="name" placeholder="Masukkan nama Anda" required>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="contoh@mail.com" required>
            </div>

            <div class="input-group">
                <label for="subject">Subjek</label>
                <select id="subject" name="subject">
                    <option value="general">Pertanyaan Umum</option>
                    <option value="support">Dukungan Teknis</option>
                    <option value="feedback">Saran</option>
                </select>
            </div>

            <div class="input-group">
                <label for="message">Pesan</label>
                <textarea id="message" name="message" rows="5" placeholder="Tuliskan pesan Anda di sini..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">Kirim Pesan</button>
        </form>
    </div>

</body>
</html>
